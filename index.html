<!doctype html>
<html lang="en">
<head>
  <!-- Add this to the head section -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet" />

  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="-1">
  <meta http-equiv="CACHE-CONTROL" content="NO-CACHE">
  <title>Weather API Project</title>
  
  <!-- Link to custom CSS -->
  <link rel="stylesheet" href="css/master.css">
  <!-- Link to a font or icon set if needed -->
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;700&display=swap" rel="stylesheet">

</head>
<body>
  
  <div class="container mt-4">
    <h1 class="text-center">Weather Forecast</h1>
    <!-- Add this inside the body -->
<div id="loadingAnimation" style="display:none;" class="text-center mt-4">
  <lottie-player src="../Users/olgafilova/Downloads/loading_lottie.json" background="transparent" speed="1" style="width: 200px; height: 200px;" loop autoplay></lottie-player>
</div>
</div>

<!-- Script to load Lottie -->
<script src="https://unpkg.com/@lottiefiles/lottie-player@latest/dist/lottie-player.js"></script>


<div class="text-center">
  <p class="alert alert-info">Note: This forecast provides data for up to 30 days in advance. No past weather data (archive) is available.</p>
</div>
    <!-- City, Time, and Date Selection Form -->
    <form id="cityForm" class="mt-3">
      <div class="mb-3">
        <label for="citySelect" class="form-label">Choose a City:</label>
        <select id="citySelect" name="city" class="form-select">
          <!-- City options will be populated dynamically -->
        </select>
      </div>

      <div class="mb-3">
        <label for="timeSelect" class="form-label">Choose a Time of Day:</label>
        <select id="timeSelect" name="time" class="form-select">
          <!-- Time options (24-hour format) -->
          <option value="0">00:00</option>
          <option value="3">03:00</option>
          <option value="6">06:00</option>
          <option value="9">09:00</option>
          <option value="12">12:00</option>
          <option value="15">15:00</option>
          <option value="18">18:00</option>
          <option value="21">21:00</option>
        </select>
      </div>

      <!-- Date picker to allow users to select a date -->
      <div class="mb-3">
        <label for="dateSelect" class="form-label">Choose a Date:</label>
        <input type="date" id="dateSelect" name="date" placeholder="dd/mm/yyyy" class="form-control"/>
      </div>
      <button type="submit" class="btn btn-primary">Get Weather</button>
  </form>

    <!-- Section to display weather results -->
    <div id="weatherDisplay" class="mt-4">
      <!-- Weather info will appear here after the API call -->
    </div>

   

  
  <!-- Footer Section -->
  <footer>
    <p>© 2023 Your Project</p>
  </footer>

  <!-- Link to the JS file -->
  <script src="js/main.js"></script>
</body>
</html>
